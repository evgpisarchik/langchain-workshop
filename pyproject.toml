[project]
name = "langchain-examples"
version = "0.1.0"
description = "Structured LangChain / LangGraph examples running on an OpenAI-compatible gateway"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "marimo>=0.25.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[tool.marimo.runtime]
# Notebooks make (slow, billed) LLM calls: don't run on open, and mark dependent
# cells stale instead of re-running them when a cell changes.
auto_instantiate = false
on_cell_change = "lazy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
